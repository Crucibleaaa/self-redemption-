statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-15)。从观测到降维: 对称性 = 降维机制.

    ★ 观点内容 (每环锚到已证 claim):
      ① 对称性 = 降维: 反射 (对称性) 的固定点集 = 低一维子空间
         (镜面 = n−1 维 — 经典等距变换不动点理论)
      ② 对称对 → 还原点: 对称对 (x, y) 经反射降维 → 固定点/还原点
         = 中点 (x+y)/2 (R144/R145: 0 与 1 = 对称对还原点)
      ③ 连续统 = 对称性降维闭包: 反复降维 (还原点/中点) 生成稠密格点,
         闭包 = 连续统 (R151 内生化: patGrid' = 还原点闭包 — 定义层零 Nat)
      ④ 例证 (用户补充): 减少一个就得成对减少 — 对合 f 的轨道分解:
         非不动点成对出现 (轨道 {x, f(x)} 大小 2), 不动点轨道大小 1;
         从 f-闭集合删 x 非不动点 ⟹ 必须同时删 f(x) 保持对称 (R136
         增加成对 ↔ 本性质减少成对 — 对称性守恒: 增/减都成对)
      ⑤ 结构承载信息 (用户补充): 对称性的每个方向, 从结构承载信息的
         角度, 认为有两个基点 — 对称对 (x, f(x)) 的两端互为基础点
         (位置信息 = 相对另一端), 方向信息由两点结构承载 (单基点只
         定义距离, 双基点承载方向); 连续统构造从方向声明对 {0, 2π}
         两个基点出发 (R144/R145: 0 与 1 = 对称对还原点; numeral 结构
         base+cardinality 双特征同构)
      ⑥ 实证观测 (训练数据): midpoint 运算 (对称对 → 2N 环中点槽位,
         分子表示 self(a,b) = a+b) 进 20 运算混合训练 — 4616 样本,
         OOD 600 (训练外参数), epoch 13 达判定 1.000 — 对称性降维
         结构可学习 (神经网络 OOD 泛化 = 实证观测, 记录于此)

    ★ 材料分层 (用户纪律 2026-08-15): 不能用 pat 产生的任何内容来构造
      — 实证/证明只用外部材料 (经典数学/范畴论, 零 pat token/pat 定理
      引用); pat 内部内容 (token/定理/训练) 仅作系统一致性观测, 不作
      外部实证.

    ★ 外部实证 (独立锚 — 经典材料, 零 pat 引用):
      E1 丢商/纤维 (经典模运算 x % N, ℤ/N 环):
         - 2000 个 x ∈ [0, 10⁵), N = 10: 每槽平均 200 个原像
           (纤维 > 1, 多解) — 无商不可判定
         - 写入余数丢商: 商必须单独存储才能恢复 — 单独存在的必要性
         - 材料: 经典模运算/纤维 (mathlib/Python 原生, 非 pat token)
      E2 对角线 (Cantor / Lawvere 不动点定理, 经典):
         - 无满射 ℕ → 2^ℕ (Cantor 对角线 — 经典定理)
         - Lawvere: 存在无不动点自映射的 B ⟹ 无满射 A → Bᴬ — 写入
           必有逃逸 — 逃逸项必须单独存在 (数学必然, 非约定)
         - 材料: 集合论/范畴论 (外部, mathlib 可形式化)
      E3 连续统 (经典 ℝ, 外部):
         - dyadic 有理稠密 (经典) — 连续统 = 稠密集闭包 (经典事实)
         - Cantor 不可数 — 连续统不可写入可数结构 (外部定理)
         - 对应 R150/R151 的"格点/闭包"仅是对经典结构的命名 (表示),
           非构造材料

    ★ 内部一致性观测 (pat 系统自检 — 非外部实证):
      I1 midpoint (对称性降维运算) 训练: OOD 600 样本 epoch 13 → 1.000
         — pat 运算定义可学习 (系统内部一致)
      I2 relpos (双基点段信息运算) 训练: OOD 630 epoch 12 → 1.000
         — 同上
      I3 单基点方向: 结构性不可定义 (样本不存在) — pat 内观测
      I4 摘除矩阵 (2026-08-15, token 层):
         ① 全摘 (无样本/箭头/构造): 恢复 0/23 — 不恢复
         ② 有样本 (neg/reciprocal 对错题): neg 10/10 恢复
         ③ token 摘除 (inversion 零训练, 箭头 A:91 + 构造 + vocab
            全提供): 不恢复 ✗ — 结构存在 ≠ 模型可用
         ④ dummy token (不用的干扰项): 无影响
         ⟹ 样本 (对错题) 是模型提取结构信息的唯一决定性通道;
           结构 (箭头/构造/vocab) 承载信息 (本体论) 但提取必须
           经样本通道 (认识论) — 两者分离
      I4b 伪恢复验证 (逐 token 级, 2026-08-15):
         ②' 只构造+箭头 (无对错题, 全真样本): inversion 探针 2/3
            表面恢复 — 逐 token 检查证伪: 真探针 ✓ (完整重建) +
            假探针 ✗ = truth bias (训练无错题, 只会输出 truth_true),
            非真理解; 且 ±1 是退化点 (reciprocal(±1)=±1 恒等,
            inversion 与 neg 不可区分) — 模式转移无法排除
         ②'' mod 域 (ℤ/7, reciprocal=乘法逆元, 非退化) 严格重测:
            inv(2)=3 ≠ neg(2)=5 — 模式转移会被探针 ✗ 暴露.
            结果: ②' 的 inv 2/3 在 mod 域仍 2/3 (seed 0/2) 但
            seed 1 崩 (inversion 槽输出 sign_pos — 符号/概念混淆)
            + 假探针全 ✗ — 伪恢复性质确认 (bias + 不稳定)
         ⟹ 恢复判定必须: 非退化点探针 + 错题 + 多 seed 稳定;
           单靠真探针 ✓ 不可信 (truth bias 可制造假恢复)
      I5 符号映射实验 (2026-08-15, 表达与概念分离):
         假设 (用户): 数轴上的自然数符号映射没法稳定学习 —
         位置不变数值变 (同一 digit 符号在不同位置值不同)
         = 表达与概念的分离; stoken 需映射到 ctoken (符号对应语义).
         实验 (训练 0..49, OOD 50..999, 完整序列重建):
           A 符号→概念 (跨层): 裸 glyph 序列 [symbol_1][symbol_2]
             → 概念结构 [sign base cardinality digit_1 digit_2]:
             训练 acc 1.000, OOD 0/15 — 训练内学会, 外推全崩
           C 概念→概念 (同层): 概念结构 ↔ 概念结构比较:
             训练 acc 1.000, OOD 30/30 — 外推完美稳定
         ⟹ 初步结论 (后被 I7 修正): 跨层符号→语义映射不稳定.
           注意: A/C 存在混杂 (序列长度/结构显式性/部件共享度),
           归因"表达与概念分离"是推断非实证 (2026-08-15 诚实评估)
      I7 纯结构嵌套实验 (2026-08-15, 底座测试, 用户纠正方向):
         设计 (用户指令): 无符号 token (零 S 层), 无基点漂移
         (零位置-值/numeral 结构) — 纯 4 概念 token
         (value_zero / succ / addition / multiplication),
         数字 = succ 嵌套应用 (succ^n zero), 加法/乘法 = 结构
         嵌套判定, 0..4 全枚举含 0 的加乘 (0+0 0+m m+0 0×0
         0×m m×0), 100 样本.
         结果 (5 seeds 全部):
           训练 acc = 1.000 (全部收敛)
           OOD 36/36 (5+5 3×5 6+6 7+2 5×5 3×7 7×2 等结构外推,
           完整序列重建全对)
         ⟹ 纯概念结构 (同构嵌套) 完全可学习且稳定外推 — 底座
           成立; 崩的只有 I5-A (裸符号异构组合). 精确归因修正:
           表达与概念**同构** (嵌套结构: succ 应用规则显式,
           输出链与输入链同构, 长度可数) → 稳定;
           表达与概念**异构** (位置-值符号: 相邻无组合规则,
           位置权隐含, 输出结构异质) → 只学查表, 无法外推.
           表面层 (符号记法/位置-值) 不承载结构 — 结构在
           概念层 (嵌套), 符号侧需要桥结构否则不稳.
      I7b 0 的加乘外推 (2026-08-15, 用户补充):
         OOD 探针扩展: 0 与训练外数字组合 (0+5 5+0 0×5 5×0,
         0+6 6+0 0×6 6×0, 0+7 7+0 0×7 7×0 — 真 + 错题)
         结果 (4 seeds 全一致): 训练 1.000,
           OOD 含 0 组合 12/12 + 非 0 组合 48/48 = 60/60 全过
         ⟹ 0 的单位元规则 (0+n=n) 与零吸收规则 (0×n=0) 在
           结构嵌套表示下可学习且外推到训练外数字 — 0 的加法
           乘法结构嵌套 + 直觉 + 外推全链路成立
      I7c 四种 0 的定义方式对比 (2026-08-15, 用户指令 "0 怎么定义"):
         ① 公设 0 : zero_axiom (C 层注入, form=axiomatic 无定义)
         ② 结构 0 : value_zero (迭代零点 iterate(iteration_layer))
         ③ 直觉 0 : 空链缺省 (数字=succ^n, 0=无 successor, 0 无
                     token — op 后参数缺失 = 0; 0+0 序列塌缩为
                     [is_true][bracket][op][bracket][equals][truth])
         ④ 相对 0 : 0 从加减法关系定义 (x-x=0 对消, x-0=x 单位元,
                     训练=加法+对消, 无乘法)
         结果 (每组 3 seeds 全一致): 四种全部 训练 1.000 +
           OOD 全过 (①②③ 60/60; ④ 纯加减 OOD 36/36;
           ④ 初版 OOD 含乘法 30 条全崩 = 训练无乘法样本, 非 0 问题)
         ⟹ 0 的定义方式 (公设/结构/缺省直觉/关系对消) 对训练
           直觉零影响 — 全收敛全外推. 训练直觉只看到表示形式
           (序列), token 定义层 (公设 vs 迭代零点 vs 无 token)
           完全不可见 — 定义选择是语义/形式化层面 (Lean 内生
           纪律: 禁止字面量 0 作特权基点), 训练层面 4 种等价
      I7d succ 结构直觉对比 (2026-08-15, 用户指令 "后继的结构直觉
           设计对比"):
         设计: 0 的 4 种定义 × succ 的 2 种设计 = 8 组矩阵
           succ 结构: 数字 = [succ]×n + [0底] — 后继是显式概念
           succ 直觉: 数字 = [value_one]×n + [0底] — 无 succ
             token, 原子计数 (unary, 序列长度 = 数值; 乘法 =
             计数复制)
         结果 (8 组 × 3 seeds = 24 次训练全一致):
           全部 训练 1.000 + OOD 全过
           (①②③ 类 60/60; 相对 0 类 36/36)
         ⟹ succ 的设计方式 (显式后继概念 vs 隐式原子计数) 对
           训练直觉零影响 — 与 0 的 4 种定义结论完全一致:
           训练直觉只对表示形式敏感 (同构嵌套: 长度可数/部件
           共享), 概念定义层 (0 公设/结构/缺省, succ 显式/隐式)
           对训练不可见. 可学习性分界 = 同构 (稳) vs 异构
           (位置-值符号, 崩, I5-A) — 与 token 定义方式无关
      I7e 结构直觉 vs 符号 token 对比 (2026-08-15, 用户指令):
         设计 (用户要点: ① 训练范围不只 0/2 — 扩到加法 0..9
         全枚举 + 乘法 0..4; ② 对比符号 token — 位置不变数值变;
         ③ 每个数值设计一个位置 / numeral 是直觉路径):
           A 真正的 numeral: succ^n zero — 基点出发的后继链
             (用户纠正 2026-08-15: numeral 本身就是直觉 = 基点
             出发的 succ 链条; 加法 = 基点出发两条 succ 链,
             拼接 = 链长相加 — 同构)
           B 符号裸: symbol_numeral 序列 (S 层 glyph) — 位置不变
             数值变 (10 的 symbol_1 vs 1 的 symbol_1)
           C 位置-值记法: numeral_of(n) — base/cardinality 槽 +
             digit 排序 = 位权 (⚠ 这是位置-值记法, 非 succ 链
             numeral; 用户纠正: 真 numeral = A 组)
           D 显式位置: [symbol_d][place_p] 对 (每个数值配位置
             token; D' 修复: 训练 0..14 含 place_1 信号, OOD 15..20)
         结果 (3 seeds 全一致):
           A: 训练 1.000, OOD 30/30 稳
           B: 训练 1.000, OOD  0/30 崩
           C: 训练 1.000, OOD 30/30 稳
           D: 训练 1.000, OOD  0/30 崩 (D' 含 place_1 训练: 0/22 仍崩)
         ⟹ 用户论点修正: 不是"没有符号只有 ctoken 不行" — 恰好
           相反: 没有**结构**只有符号不行 (B/D 崩); 纯 ctoken
           (A/C) 完全可行. 位置不变数值变的本质: 位置-值必须由
           结构承载 — 位置-值记法 (C: base 值 + cardinality 槽 +
           digit 排序 = 位权) 可稳定外推; 裸符号 (B) 位置纯隐含
           崩; 名义位置 token (D) 无位权结构语义崩 (place token
           是标记, 模型无法从标记学权值 10 的通用规则). 符号层
           (S 层 glyph) 不承载位置-值 — 承载者是结构; 而真正的
           numeral (基点 succ 链, A) 无需位置概念 — 数值 = 链长,
           加法 = 拼接 (同构), 天然稳定 (I7 底座)
      I7f 0 组合留出实验 (2026-08-15, 用户指令 "几个 0 训练,
           几个 0 不训练"):
         用户洞察: 之前 OOD 的 0×5 不算真 OOD — 训练已含
         0×0..0×4, 模型可类比 0 吸收律. 真 OOD = 部分 0 组合
         不训练.
         设计 (纯结构 succ, 训练 0..9 加乘):
           全训组: 0 组合全训 (400 样本) — 基线
           留出组: 0×5..0×9, 5×0..9×0, 0+5..0+9, 5+0..9+0
             不训练 (360 样本; 0×0..0×4 等 5 个 0 乘法训练)
         OOD: 留出的 0 组合 40 条 + 训练外数字 (10 相关) 24 条
         结果 (3 seeds 全一致):
           全训组: 远 OOD 24/24
           留出组: 留出 0 OOD 40/40 + 远 OOD 24/24
         ⟹ 用户断言验证: "其他乘法样本多也能收敛" ✓ — 且未训练
           的 0 组合 (0×5..0×9) 从 5 个 0 训练样本 + 大量非 0
           乘法 (81 个) 外推 0 吸收律/单位元律 — 40/40 全对.
           0 组合的真实 OOD 成立: 0 的规则可从稀疏样本结构外推
      I7g 0 乘法 vs 非零乘法对比 (2026-08-15, 用户指令 "0 乘法
           需要和非零乘法对比, 表示无法稳定训练"):
         设计: ① 非零乘法训练 (m,n ∈ 1..9, 162 样本 — 0 完全
           不作操作数, 0 乘法零样本); ② 混训 (0..9 全枚举含
           0 乘法, 200 样本). OOD 相同: 0×1..0×9, 1×0..9×0,
           0×0, 10×2, 10×0, 0×10 (45 条).
         结果 (3 seeds 全一致): ① 非零训练 0 乘法 OOD 45/45 ✓
           ② 混训 0 乘法 OOD 45/45 ✓ — 两者无差异
         ⟹ "表示无法稳定训练" 被证伪: 0 乘法完全零样本也能外推
           (0×n = 0 从链长乘法规则外推: 0 链 = 链长 0, 链长 0 ×
           链长 n = 链长 0 → [zero]). 0 的表示 (链底 [zero] 作为
           操作数) 无需训练样本 — 模型学到的是链长乘法规则,
           0 链长自然外推. 真正的 numeral (succ 链) 下 0 乘法
           无特殊性问题: 0 是链长 0, 与链长乘法规则一致
      I7h succ 平移不变性 + value_zero 错题 (2026-08-15, 用户
           指令 "0 后继 1 的 succ 和 1 后继 2 的 succ 是否是
           同一个"):
         设计: succ 判定 (succ(n)=n+1), 训练范围变化 (只训
           succ(0) 到 succ(0..4)), OOD succ(1..7); value_zero
           错题变体 (succ(0)≠0, 0≠1, 0≠2 含/不含).
         结果 (8 组 × 3 seeds 全一致): 全部 14/14 —
           只训 succ(0)=1 (2 样本) 即外推 succ(1..7) 全对;
           0 错题无差异.
         ⟹ 后继同一性实证: 0→1 与 1→2 是**同一个 succ** —
           模型从单个样本 (succ(0)=1) 学到平移不变规则 (链上
           每步追加一个 succ), 外推任意 n. 这解释了 E3 链长
           外推成功的机制: succ 平移不变性. value_zero 错题
           在此任务无影响 (规则可从单样本学到)
      I7i 不同轴的 succ + 单轴消融 (2026-08-15, 用户指令
           "考虑不同轴的 succ, 每轴单独 succ 是否可以消融"):
