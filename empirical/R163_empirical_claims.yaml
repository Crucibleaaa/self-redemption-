assistant_original_words: |
  ★★★ assistant 原话 (2026-08-15, 用户指令记录, 原封不动保存):
  "对称性 = 降维: 反射的固定点集 = 低一维子空间 (镜面 = n−1 维, 经典等距群);
   对称对 (x,y) 经反射降维 → 还原点 (x+y)/2 (R144/R145: 0 与 1 = 对称对还原点);
   连续统 = 对称性降维的极限闭包 — 修法: patGrid' = 还原点闭包 (定义层零 Nat,
   稠密性是降维闭包的推导结果). 实证 = 训练数据: midpoint 运算 (对称对 → 2N 环
   中点槽位, 分子表示 self(a,b)=a+b) 进 20 运算混合训练, OOD 600 样本 epoch 13
